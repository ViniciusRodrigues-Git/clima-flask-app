<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css'>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-info">
                <img src="{{ url_for('static', filename='images/nublado.png') }}" class="logo-icon">
                <div>
                    <h1>Consulta de Clima</h1>
                    <p>Veja as condições do tempo na sua cidade</p>
                </div>
            </div>
        </header>

        <form method="POST" class="search-area">
            <div class="input-box">
                <i class="fi fi-sr-marker"></i>
                <input type="text" name="cidade" placeholder="Digite o nome da cidade">
            </div>
            <button type="submit">
                <i class="fi fi-sr-search"></i> Buscar
            </button>
        </form>

        {% if temp %}
        <div class="main-card">
            <div class="weather-display">
                <img src="{{ url_for('static', filename='images/nublado.png') }}" class="big-icon">
                <div class="temp-data">
                    <h2><i class="fi fi-sr-marker"></i> {{ cidade }}</h2>
                    <p class="desc">{{ desc }}</p>
                    <span class="main-temp">{{ temp|round(1) }}°C</span>
                </div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <i class="fi fi-sr-thermometer-half"></i>
                <div>
                    <span>Temperatura</span>
                    <strong>{{ temp }}°C</strong>
                </div>
            </div>
            <div class="info-item">
                <i class="fi fi-sr-cloud"></i>
                <div>
                    <span>Condição</span>
                    <strong>{{ desc }}</strong>
                </div>
            </div>
            <div class="info-item">
                <i class="fi fi-sr-drop"></i>
                <div>
                    <span>Umidade</span>
                    <strong>{{ umid }}%</strong>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

</body>
</html>
